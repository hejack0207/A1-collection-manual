- repo: https://github.com/apache/hadoop
  branch: master
  basedir: pj-hadoop
  paths:
    - srcpath: hadoop-hdfs-project/hadoop-hdfs/src/site/markdown
      path: .
- repo: https://github.com/apache/zookeeper
  branch: master
  basedir: pj-zookeeper
  paths:
    - srcpath: zookeeper-docs/src/main/resources/markdown
      path: .
- repo: https://github.com/elastic/elasticsearch
  branch: master
  basedir: pj-elasticsearch
  paths:
    - srcpath: docs
      path: .
- repo: https://github.com/apache/kafka
  branch: "3.0"
  basedir: pj-kafka
  paths:
    - srcpath: docs
      path: html
- repo: https://github.com/etcd-io/website
  branch: main
  basedir: pg-etcd
  paths:
    - srcpath: content/en/docs/v3.5
      path: .
    - srcpath: content/en/docs/v2.3
      path: v2.3-md
